name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt -e libs/afcommon
      - name: Guard against dev-shim imports (must use installed package names)
        run: |
          ! grep -rn "from libs\.\|import libs\." services/ libs/ --include='*.py'
      - name: Guard against absolute self-imports in service code (break inside containers)
        run: |
          # Service src/ modules must use relative imports within their own package:
          # 'from services.X.src...' resolves under pytest (repo root on sys.path) but
          # crashes in the container, where src/ is copied to /app/src. Caught live twice.
          ! grep -rn "from services\.\|import services\." services/*/src/ --include='*.py'
      - name: Lint
        run: ruff check .
      - name: Unit & integration tests (stub adapter only — no LLM in CI)
        run: pytest -v

  build-images:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build
