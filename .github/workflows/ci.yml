name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt -e libs/afcommon
      - name: Lint
        run: ruff check .
      - name: Unit & integration tests (stub adapter only — no LLM in CI)
        run: pytest -v

  build-images:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: docker compose build
