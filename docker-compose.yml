services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  placement:
    image: daprio/dapr:1.15.4
    command: ["./placement", "-port", "50006"]

  intake-api:
    build:
      context: .
      dockerfile: services/intake/Dockerfile
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy

  intake-api-dapr:
    image: daprio/daprd:1.15.4
    command:
      [
        "./daprd",
        "--app-id", "intake-api",
        "--app-port", "8000",
        "--dapr-http-port", "3500",
        "--resources-path", "/components",
        "--placement-host-address", "placement:50006",
      ]
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/secrets.json:/dapr/secrets.json:ro
    network_mode: "service:intake-api"
    depends_on:
      intake-api:
        condition: service_healthy
